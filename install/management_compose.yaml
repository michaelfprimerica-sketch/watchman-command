name: watchman-command

# Watchman Command management services Docker Compose configuration
#
# This compose file starts only the minimum services required for Command Center
# access and keeps runtime data isolated to the Watchman Command project.
services:
  admin:
    image: watchman-command-admin:local
    build:
      context: ${WATCHMAN_PROJECT_ROOT}
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ${WATCHMAN_STORAGE_DIR:-./storage}:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production
      - NOMAD_STORAGE_PATH=${WATCHMAN_STORAGE_DIR:-./storage}
      - PORT=8080
      - LOG_LEVEL=info
      - APP_KEY=${WATCHMAN_APP_KEY}
      - HOST=0.0.0.0
      - URL=${WATCHMAN_URL:-http://127.0.0.1:8080}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=nomad
      - DB_USER=nomad_user
      - DB_PASSWORD=${WATCHMAN_DB_PASSWORD}
      - DB_NAME=nomad
      - DB_SSL=false
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DISABLE_COMPRESSION=false
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${WATCHMAN_DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=nomad
      - MYSQL_USER=nomad_user
      - MYSQL_PASSWORD=${WATCHMAN_DB_PASSWORD}
    volumes:
      - watchman-command-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - watchman-command-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  watchman-command-mysql-data:
  watchman-command-redis-data:
